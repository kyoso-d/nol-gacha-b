<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nolガチャ</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            font-family: sans-serif;
            overflow: hidden;
        }
        .container {
            width: 95%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }
        #gacha-machine {
            background: white;
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.12);
            text-align: center;
        }
        #status {
            font-size: 2.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            min-height: 2.8rem;
        }
        #result-box {
            background: #f0f2f5;
            border-radius: 20px;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
            padding: 20px;
            box-sizing: border-box;
        }
        #result {
            font-size: 2.0rem;
            font-weight: bold;
            margin: 0;
            width: 100%;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
            display: block;
            word-break: break-all;
        }
        #gacha-btn {
            display: block;
            width: 100%;
            padding: 22px;
            font-size: 2rem;
            font-weight: bold;
            background-color: #ff5e78;
            color: white;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            box-shadow: 0 7px 0 #d43f56;
            transition: all 0.2s;
            appearance: none;
            -webkit-appearance: none;
        }
        #gacha-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }
        #gacha-btn:disabled {
            background-color: #ffadb9;
            box-shadow: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="gacha-machine">
            <p id="status">運試しをしよう！</p>
            <div id="result-box">
                <h1 id="result">？</h1>
            </div>
            <button id="gacha-btn">ガチャを回す</button>
        </div>
    </div>
    <script>
        const btn = document.getElementById('gacha-btn');
        const resultDisp = document.getElementById('result');
        const statusDisp = document.getElementById('status');
        const gachaList = [
            { name: "✨️✨300,000nol✨✨", weight: 1 },
            { name: "✨✨光る！DDBスーツ✨✨", weight: 1 },
            { name: "✨『今こそ力を〜楽園への序章〜』(著: 大蜘蛛弾襄)✨", weight: 3 },
            { name: "🕸️スピーカーくん2ndグラビア写真集🕸️", weight: 1 },
            { name: "✨水遊びフロート(浮き輪)弾襄くん✨", weight: 2 },
  { name: "観葉植物(モンステラ)", weight: 1 },
            { name: "金魚鉢", weight: 2 },
            { name: "✨️楽園の糸✨️", weight: 8 },
            { name: "✨おすわり弾襄くん(ぬい)アロハver.✨", weight: 3 },
            { name: "夏グルメ・若鮎(鮮魚)", weight: 3 },
            { name: "✨接触冷感抱き枕(弾襄くん)✨", weight: 1 },
            { name: "✨100,000nol✨", weight: 3 },
            { name: "✨50,000nol✨", weight: 5 },
            { name: "✨10,000nol✨", weight: 4 },
            { name: "✨ガチャチケット3回分✨", weight: 3 },
            { name: "5,000nol", weight: 6 },
            { name: "1,000nol", weight: 3 },
            { name: "絶品！鱧のフルコース", weight: 2 },
            { name: "季節の和菓子・初夏(紫陽花の琥珀糖)", weight: 2 },
            { name: "電動自転車", weight: 2 },
            { name: "レア・ブロマイド Go Ueki", weight: 2 },
            { name: "ポストカードセット(BoP2026)", weight: 1 },
            { name: "江戸風鈴(金魚柄)", weight: 2 },
            { name: "リングライトキャンディ(任意の色)", weight: 4 },
            { name: "普通の扇風機", weight: 2 },
            { name: "スイカ 1 玉", weight: 3 },
            { name: "ひんやり水うちわ", weight: 1 },
            { name: "とあるコラボカフェのサテンステッカー×5", weight: 3 },
{ name: "とあるコラボカフェの抹茶フラペチーノ", weight: 3 },
            { name: "とあるコラボカフェのシャカシャカパーツ×1", weight: 3 },
            { name: "とあるコラボカフェのディビジョンフラッグ×1", weight: 3 },
            { name: "とあるコラボカフェの缶バッジ×3", weight: 3 },
            { name: "流せるポケットティッシュ", weight: 14 }
        ];
        btn.onclick = function() {
            btn.disabled = true;
            statusDisp.innerText = "抽選中...";
            resultDisp.innerText = "⏳";
            const shuffle = setInterval(() => {
                resultDisp.innerText = gachaList[Math.floor(Math.random() * gachaList.length)].name;
            }, 50);
            setTimeout(() => {
                clearInterval(shuffle);
                const totalWeight = gachaList.reduce((sum, item) => sum + item.weight, 0);
                let randomNum = Math.random() * totalWeight;
                let selectedItem = gachaList[gachaList.length - 1];
                for (const item of gachaList) {
                    if (randomNum < item.weight) {
                        selectedItem = item;
                        break;
                    }
                    randomNum -= item.weight;
                }
                resultDisp.innerText = selectedItem.name;
                statusDisp.innerText = "結果発表！";
                if (selectedItem.name.includes("300,000") || selectedItem.name.includes("弾襄")) {
                    confetti({
                        particleCount: 150,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#ff5e78', '#ffd700', '#ffffff']
                    });
                }
                btn.disabled = false;
            }, 1500);
        };
    </script>
</body>
</html>
